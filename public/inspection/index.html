<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Inspection | Complee</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    body { overflow: hidden; }
    iframe { display: block; }
    .fallback { position: fixed; z-index: 1; right: 0.75rem; bottom: 0.5rem; padding: 0.4rem 0.65rem; border-radius: 0.35rem; background: #fff; font: 13px system-ui, sans-serif; }
  </style>
</head>
<body>
  <iframe id="shipcheck" title="Complee compliance inspection" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
  <a id="standalone" class="fallback" target="_blank" rel="noopener noreferrer">Open viewer directly</a>
  <script>
    const viewer = new URL('https://diagnosis-coating-heritage-offerings.trycloudflare.com/index.html');
    viewer.search = location.search;
    viewer.hash = location.hash;
    if (!viewer.searchParams.has('scenario')) viewer.searchParams.set('scenario', 'rcrv-3d');
    document.getElementById('shipcheck').src = viewer.href;
    document.getElementById('standalone').href = viewer.href;
  </script>
</body>
</html>
