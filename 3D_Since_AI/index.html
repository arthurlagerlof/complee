<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ship model viewer</title>
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css" />
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; }
      #viewer { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <script>
      const options = {
        env: 'AutodeskProduction2',
        api: 'streamingV2',
        getAccessToken: async (callback) => {
          const t = await (await fetch('/token')).json();
          callback(t.access_token, t.expires_in);
        },
      };
      Autodesk.Viewing.Initializer(options, async () => {
        const viewer = new Autodesk.Viewing.GuiViewer3D(document.getElementById('viewer'));
        viewer.start();
        window.viewer = viewer; // handy for the browser console
        const urn = (await (await fetch('/urn')).text()).trim();
        Autodesk.Viewing.Document.load(
          'urn:' + urn,
          (doc) => viewer.loadDocumentNode(doc, doc.getRoot().getDefaultGeometry()),
          (code, msg) => console.error('Load failed', code, msg)
        );
      });
    </script>
  </body>
</html>
