# ShipCheck on one Linux server: the Node app behind Caddy (HTTPS, compression).
# On the server (in REMOTE_DIR):  docker compose -f deploy/docker-compose.yml up -d --build
# Settings come from deploy/server.env (written by deploy.sh / deploy.ps1): DOMAIN, ALLOWED_ORIGINS,
# SHIPCHECK_DATA_API_URL and, for
# MODEL_SOURCE=vultr (model tiles streamed from Vultr Object Storage instead of ../model), VULTR_S3_*.
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SHIPCHECK_DATA_API_URL: ${SHIPCHECK_DATA_API_URL:-}
      REGULATION_API_URL: ${REGULATION_API_URL:-}
      TRUST_CLOUDFLARE_TUNNEL: ${TRUST_CLOUDFLARE_TUNNEL:-false}
      EVIDENCE_PROVIDER: ${EVIDENCE_PROVIDER:-sinceai}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-model/}
      MODEL_SOURCE: ${MODEL_SOURCE:-local}
      VULTR_S3_ENDPOINT: ${VULTR_S3_ENDPOINT:-}
      VULTR_S3_BUCKET: ${VULTR_S3_BUCKET:-}
      VULTR_S3_ACCESS_KEY: ${VULTR_S3_ACCESS_KEY:-}
      VULTR_S3_SECRET_KEY: ${VULTR_S3_SECRET_KEY:-}
      VULTR_S3_REGION: ${VULTR_S3_REGION:-}
    volumes:
      - ../model:/app/model:ro
      - model_cache:/app/.cache
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:443:443"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  model_cache:
  caddy_data:
  caddy_config:
