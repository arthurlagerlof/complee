<script type="module">

   const pos=decode(pa.bufferView),ix=decode(ia.bufferView),geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.InterleavedBufferAttribute(new THREE.InterleavedBuffer(new Uint16Array(pos.buffer),j.bufferViews[pa.bufferView].byteStride/2),3,(pa.byteOffset||0)/2,!!pa.normalized));geom.setIndex(new THREE.BufferAttribute(new Uint32Array(ix.buffer,ia.byteOffset||0,ia.count),1));

   if(pa.count!==chunks[i].vertices)throw Error('Vertex identity changed');

  }

</script>
